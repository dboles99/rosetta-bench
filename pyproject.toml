[project]
name = "rosetta-bench"
version = "0.1.0"
description = "Harness for comparing human-readable and machine-readable prompts across LLM tools"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Daniel Boles" }]
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "gspread>=6.0",
    "google-auth>=2.29",
    "anthropic>=0.34",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
azure = ["openai>=1.30"]

[project.scripts]
bench = "rosetta_bench.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
